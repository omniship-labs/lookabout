; Lookabout firmware — ESP32-S3 with a USB webcam
;
; The S3 acts as a USB host, reads a standard (UVC) webcam as MJPEG and
; serves it over Wi-Fi. See README.md for wiring, power and what to expect.
;
; ESP-IDF rather than Arduino: the UVC host driver (espressif/usb_host_uvc)
; is an ESP-IDF component and isn't available in the Arduino core.
;
; NOT supported: classic ESP32, C3, C6. They have no USB host port.

[platformio]
default_envs = esp32-s3-uvc

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
; Two app slots so the board can be updated over Wi-Fi (POST /api/update).
board_build.partitions = partitions_two_ota_large.csv
board_upload.flash_size = 4MB
build_flags =
    -D LOOKABOUT_FW_VERSION=\"0.1.0\"

; ESP32-S3 DevKitC-1 and compatible boards without PSRAM (N8, N16).
[env:esp32-s3-uvc]
board = esp32-s3-devkitc-1

; Boards with 8 MB octal PSRAM (N8R8, N16R8): room for larger frames.
[env:esp32-s3-uvc-psram]
board = esp32-s3-devkitc-1
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.psram"
