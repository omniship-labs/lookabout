name: Build

# Checks on every pull request: the web app builds, the web, hub and Pi camera
# node tests pass without coverage falling below each part's floor, the web app
# is driven in Chromium against a real hub process, and the ESP32 firmware
# builds and passes its tests in the QEMU emulator.

on:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          # @omniship-labs/design-beacon comes from GitHub Packages.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      # Runs the tests and fails if web coverage drops below its floor (scripts/coverage.mjs).
      - run: npm run coverage

  # The built web app, in Chromium, against a real hub process (tests/browser): first admin, household,
  # invites, passkeys (a virtual authenticator), the setup wizards. No camera, go2rtc or Pi needed.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy cryptography
      # Playwright is only for these checks, so it is not in package.json.
      - run: npm install --no-save --no-package-lock playwright@1.63.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm run browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-check-screenshots
          path: tests/browser/out
          if-no-files-found: ignore

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Needs numpy and ffmpeg (preinstalled on the runner); go2rtc and the model are not needed.
      - run: pip install numpy coverage cryptography
      # Floor in hub/.coveragerc.
      - run: python3 -m coverage run -m unittest discover -s tests -v
        working-directory: hub
      - run: |
          { echo "### Hub coverage"; python3 -m coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY" || true
          python3 -m coverage report
        working-directory: hub

  pi-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The node is standard library only; coverage is just for measuring it.
      - run: pip install coverage
      # Floor in firmware/rpi/.coveragerc.
      - run: python3 -m coverage run -m unittest discover -s tests -v
        working-directory: firmware/rpi
      - run: |
          { echo "### Pi camera node coverage"; python3 -m coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY" || true
          python3 -m coverage report
        working-directory: firmware/rpi

  # The ESP32 camera firmware: build it for the real board, then run an
  # emulator build in QEMU and drive it over HTTP (firmware/esp32/qemu).
  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build the real firmware (ESP32-S3)
        working-directory: firmware/esp32
        run: |
          . "$IDF_PATH/export.sh"
          # PlatformIO keeps the app in src/; plain ESP-IDF needs telling.
          idf.py -B build-s3 -DIDF_TARGET=esp32s3 -DSDKCONFIG=build-s3/sdkconfig -DEXTRA_COMPONENT_DIRS="$PWD/src" build
      - name: Build the emulator images
        run: |
          . "$IDF_PATH/export.sh"
          firmware/esp32/qemu/build.sh
      - name: Install QEMU
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          python3 "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
      - name: Run the firmware in QEMU
        run: |
          . "$IDF_PATH/export.sh"
          export QEMU="$(command -v qemu-system-xtensa || ls "${IDF_TOOLS_PATH:-$HOME/.espressif}"/tools/qemu-xtensa/*/qemu/bin/qemu-system-xtensa | head -1)"
          "$QEMU" --version
          python3 firmware/esp32/qemu/test_board.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: esp32-qemu-logs
          path: firmware/esp32/qemu/out/logs
